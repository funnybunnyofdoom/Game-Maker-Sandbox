<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Maker Sandbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
:root{--bg:#e8ecf2;--fg:#1d2230;--bt:#fff;--bd:#b4bccb;--ac:#e8913a;--ar:1.5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--fg:#e8ebf2;--bt:#222735;--bd:#3a4152}}
:root[data-theme="dark"]{--bg:#12141a;--fg:#e8ebf2;--bt:#222735;--bd:#3a4152}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:env(safe-area-inset-top,0px) 10px env(safe-area-inset-bottom,0px);box-sizing:border-box;overflow:auto}
.hid{display:none!important}
#menu,#size{background:linear-gradient(#5aa7f5,#bfe3ff 68%,#d6b75d 68%,#d6b75d 82%,#6b6b73 82%);color:#2a2f3d}
h1{font:28px/1.3 "Press Start 2P","Courier New",monospace;margin:0 0 18px;text-align:center;text-shadow:3px 3px 0 rgba(255,255,255,.6)}
.mb{font:13px "Press Start 2P","Courier New",monospace;min-width:min(280px,80vw);height:auto;padding:14px 16px;border:3px solid #2a2f3d;border-radius:0;background:#f4e3a8;color:#2a2f3d;box-shadow:0 4px 0 #2a2f3d;touch-action:manipulation}
.mb:active{transform:translateY(4px);box-shadow:none}
.mb.s{min-width:0;font-size:10px;padding:10px 12px}
#sv{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:90vw}
#game{background:var(--bg);color:var(--fg);gap:10px}
#stage{position:relative;overflow:hidden;width:100%;max-width:min(960px,calc((100dvh - var(--rv,150px))*var(--ar)));aspect-ratio:var(--ar)}
canvas{width:100%;height:100%;image-rendering:pixelated;touch-action:none;background:#000;display:block}
.tray{position:absolute;top:0;bottom:0;width:132px;overflow-y:auto;padding:8px;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;background:rgba(18,22,32,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .2s;touch-action:pan-y;z-index:2}
.tray.l{left:0;transform:translateX(-102%)}
.tray.r{right:0;transform:translateX(102%)}
.tray.open{transform:none}
#game.p .tray{display:none}
.tray button{flex:none;min-width:0;height:40px;border:0;border-radius:8px;background:rgba(255,255,255,.14);color:#fff;font-size:13px;display:flex;align-items:center;gap:8px;padding:0 10px;touch-action:pan-y;text-align:left}
.tray i{width:16px;height:16px;border:1px solid rgba(255,255,255,.55);flex:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;width:100%;max-width:960px;padding:0 10px;box-sizing:border-box}
.g{display:flex;gap:8px}
button{position:relative;overflow:hidden;min-width:52px;height:52px;border:1px solid var(--bd);border-radius:12px;background:var(--bt);color:var(--fg);font-size:20px;touch-action:none;cursor:pointer}
button.on{outline:3px solid var(--ac)}
button b{position:absolute;top:2px;left:5px;font-size:10px;opacity:.6}
.bar>button{font-size:14px;padding:0 12px}
#rs{font-size:20px}
#bb button{height:42px;font-size:13px;padding:0 12px;min-width:0}
#bf{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(47,111,219,.45);pointer-events:none}
#gd{position:absolute;inset:0;pointer-events:none;display:none;background-image:linear-gradient(to right,rgba(0,0,0,.2) 1px,transparent 1px),linear-gradient(to bottom,rgba(0,0,0,.2) 1px,transparent 1px);background-size:calc(100%/var(--gw,12)) calc(100%/var(--gh,16))}
#game.n #gd{display:block}
#nb,#ib{max-height:30dvh;overflow-y:auto}
#nb button,#ib button{height:38px;font-size:12px;padding:0 10px;min-width:0;touch-action:pan-y}
#nm,#im,#bn,#xn{height:38px;width:120px;box-sizing:border-box;border:1px solid var(--bd);border-radius:12px;background:var(--bt);color:var(--fg);padding:0 10px;font-size:14px;user-select:text;-webkit-user-select:text}
#np,#ip{display:contents}
#fb{gap:4px;height:30px;font-size:13px}
#fb button{height:28px;min-width:30px;padding:0;border:0;background:transparent;font-size:20px;line-height:1}
#fbn{min-width:34px;text-align:center}
#fa{display:flex;align-items:center;gap:5px;margin-left:8px;cursor:pointer}
#fa input{width:18px;height:18px;margin:0}
#tl{display:flex;align-items:center;gap:4px;font-size:12px}
#tb{width:62px;height:34px;box-sizing:border-box;border:1px solid var(--bd);border-radius:10px;background:var(--bt);color:var(--fg);padding:0 6px;user-select:text;-webkit-user-select:text}
.er{color:#d33;font-size:12px}
input.bad{border-color:#d33!important}
.th{width:38px;height:28px;object-fit:cover;image-rendering:pixelated;border-radius:3px;flex:none;background:#8ec9ff}
.mb .th{width:64px;height:46px}
.mb.s{display:flex;align-items:center;gap:8px}
#pl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:90vw;max-height:70vh;overflow:auto}
.tray .row{display:flex;gap:4px;flex:none}
.tray .row button:first-child{flex:1;min-width:0}
.tray .ed{flex:none;width:34px;justify-content:center;padding:0}
.mp{position:fixed;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,94vw);max-height:88dvh;overflow:auto;box-sizing:border-box;background:var(--bt);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.mp button{height:30px;min-width:0;font-size:12px;padding:0 10px;touch-action:manipulation}
.mh{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.mh input{flex:1;min-width:90px}
.mv{display:flex;gap:6px;align-items:center}
.mv button.sw{width:28px;padding:0;border-radius:6px}
.pg{display:grid;grid-template-columns:repeat(16,1fr);gap:1px}
.pg button{height:auto;aspect-ratio:1;border:0;border-radius:0;padding:0}
.xr{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.r{display:flex;align-items:center;gap:6px;font-size:13px}
.r.w{grid-column:1/-1}
.r input[type=range]{flex:1;min-width:0}
.r input[type=number]{width:60px;height:26px;box-sizing:border-box;border:1px solid var(--bd);border-radius:8px;background:var(--bt);color:var(--fg);padding:0 4px}
.r select{flex:1;min-width:0;height:26px;background:var(--bt);color:var(--fg);border:1px solid var(--bd);border-radius:8px}
.r.t span:first-of-type{min-width:60px}
.xt{font-size:12px;opacity:.7}
#ts{gap:6px;height:34px;flex-wrap:nowrap;justify-content:flex-start}
#ts>button{height:30px;font-size:12px;min-width:0;padding:0 10px}
#ts #fb{width:auto;margin-left:auto;padding:0}
#game.p #ts{display:none}
#ot{width:164px}
#ot .bar{display:flex;flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:6px;padding:0;width:auto;max-width:none;max-height:none;overflow:visible;justify-content:flex-start}
#ot .bar>*{flex:none}
.tray{color:#fff}
.tray button{white-space:nowrap;text-overflow:ellipsis}
.tray .g{display:flex;gap:4px}
.tray .g button{flex:1;min-width:0;justify-content:center;padding:0 2px;font-size:12px}
#ot input{width:100%;box-sizing:border-box;height:36px;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:0 8px}
#ot input::placeholder{color:#ddd}
#ot #tl{display:flex;align-items:center;gap:6px;font-size:13px}
#ot #tb{width:80px}
.tray .er{color:#ff9a9a}
#cf{gap:12px;text-align:center}
#cq{font-size:14px}
#cf .mh{justify-content:center}
#inv{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#inv .iv{display:flex;align-items:center;gap:4px;background:var(--bt);border:1px solid var(--bd);border-radius:8px;padding:2px 6px;font-size:12px}
#inv img{height:18px;image-rendering:pixelated}
.tray .bk{position:sticky;top:-8px;z-index:1;background:rgba(18,22,32,.92);justify-content:center}
.tray .fl{margin-left:auto;height:18px;flex:none}
#hpb{width:170px;height:8px;border-radius:4px;background:rgba(0,0,0,.35);overflow:hidden}
#hpb i{display:block;height:100%;width:100%;background:#ef4444}
#inv{max-width:96vw}
#inv button.iv{position:relative;width:36px;height:36px;min-width:0;padding:2px;justify-content:center}
#inv .iv.empty{opacity:.35}
#inv .iv.on{outline:2px solid var(--ac)}
#inv .iv.eq{box-shadow:inset 0 0 0 2px #4ade80}
#inv .iv img{height:22px}
#inv .iv b{top:auto;left:auto;right:3px;bottom:1px;opacity:1;font-size:10px}
#inv .act{height:36px;min-width:0;padding:0 10px;font-size:12px}
.th.sp{object-fit:contain;background:#dde3ee}
</style></head><body>
<div class="scr" id="menu"><h1>Game Maker Sandbox</h1><button class="mb" data-go="play">Play</button><button class="mb" data-go="map">Map Builder</button><button class="mb" data-go="str">Structure Builder</button><button class="mb" data-go="npc">NPC Creator</button><button class="mb" data-go="pc">Player Creator</button><button class="mb" data-go="item">Item Creator</button><button class="mb" data-go="world">World Builder</button></div>
<div class="scr hid" id="size"><button class="mb" data-s="120x80">Small</button><button class="mb" data-s="240x160">Medium</button><button class="mb" data-s="360x240">Large</button><button class="mb" data-s="400x100">Long</button><div id="sv"></div><button class="mb s" data-go="menu">Back</button></div>
<div class="scr hid" id="pick"><div id="pl"></div><button class="mb s" data-go="menu">Back</button></div>
<div class="scr hid" id="game">
 <div id="ts" class="bar"><button id="otg" aria-label="Tools">☰ Tools</button><button data-go="menu">Menu</button><span id="wm" class="er"></span><div id="fb" class="bar hid"><button id="fbl" aria-label="Previous frame">‹</button><span id="fbn">1/3</span><button id="fbr" aria-label="Next frame">›</button><label id="fa"><input type="checkbox" id="fbk">Active</label></div></div>
 <div id="stage"><canvas id="c" width="240" height="160"></canvas><div id="gd"></div>
  <div class="tray l" id="ot">
   <div id="bb" class="bar hid">
    <input id="bn" maxlength="24" placeholder="Name" aria-label="Name" autocomplete="off" class="hid">
    <button id="save">Save</button><button id="del" class="hid">Delete</button><button id="clr">Clear</button>
    <button id="tgs">Structures</button><button id="tgp" class="hid">Maps</button><button id="tgi" class="hid">Items</button><button id="tgn" class="hid">NPCs</button><button id="tgm">Materials</button>
    <div class="g"><button id="dtd" class="on">Draw</button><button id="dtl">Line</button><button id="dtf">Fill</button></div>
    <button id="brush">Brush 2</button>
    <button id="spn" class="hid">Spawn Point</button><button id="trb" class="hid">Map transition</button><button id="cnb" class="hid">Container</button><button id="sim">Sim</button>
    <label id="tl" class="hid">°F<input id="tb" type="number" value="70" aria-label="Temperature"></label>
   </div>
   <div id="nb" class="bar hid">
    <button id="cp">Copy</button><button id="an">Anim</button><button id="nsz">Size 2</button><button id="mnt">Mount</button><button id="msl">Hand</button><button id="hd">Hold None</button><button id="pst" class="hid">State Idle</button><button id="pdef" class="hid">Use as player</button>
    <input id="nm" maxlength="16" placeholder="Name" aria-label="Name" autocomplete="off">
    <span id="np"></span><span id="pp" class="hid"></span>
   </div>
   <div id="ib" class="bar hid">
    <button id="isz">Size 2</button><button id="igp">Grip</button>
    <input id="im" maxlength="16" placeholder="Name" aria-label="Name" autocomplete="off">
    <span id="ip"></span>
   </div>
   <div id="wb" class="bar hid">
    <input id="wn" maxlength="24" placeholder="Name" aria-label="Name" autocomplete="off">
    <button id="wsave">Save</button><button id="wdel" class="hid">Delete</button><button id="wclr">Clear</button>
    <button id="wtm">Maps</button><button id="wts">Worlds</button>
    <button id="wch">Character Global</button><button id="wlk">Link doors</button><button id="wrm">Remove map</button><div class="g"><button id="wzo" aria-label="Zoom out">Zoom −</button><button id="wzi" aria-label="Zoom in">Zoom +</button></div>
   </div>
  </div>
  <div class="tray l" id="st"></div><div class="tray l" id="pt"></div><div class="tray r" id="mt"></div><div class="tray r" id="nt"></div><div class="tray r" id="it"></div><div class="tray l" id="wt"></div><div class="tray r" id="ht"></div><div class="tray r" id="ct"></div>
 </div>
 <div id="hpb" class="hid"><i></i></div>
 <div id="inv" class="hid"></div>
 <div id="pb" class="bar">
  <div class="g"><button data-k="l" aria-label="Move left">◀</button><button data-k="r" aria-label="Move right">▶</button><button data-k="j" aria-label="Jump">▲</button><button data-k="dn" aria-label="Down">▼</button></div>
  <div class="g"><button data-t="0" aria-label="Pickaxe"><b>1</b>⛏️</button><button data-t="1" aria-label="Torch"><b>2</b>🔥</button><button data-t="2" aria-label="Bucket"><b>3</b>🪣<i id="bf"></i></button><button data-t="3" class="hid" aria-label="Equipped item"><b>4</b>✋</button></div>
  <button id="rs" aria-label="New world">↻</button><button data-go="menu">Menu</button>
 </div>
</div>

<div id="cf" class="mp hid"><div id="cq"></div><div class="mh"><button id="cy">Yes</button><button id="cn">No</button></div></div>
<div id="me" class="mp hid">
 <div class="mh"><input id="xn" maxlength="20" placeholder="Name" aria-label="Name" autocomplete="off"><button id="xs">Save</button><button id="xd" class="hid">Delete</button><button id="xc">Close</button></div>
 <div id="xv" class="mv"></div>
 <div id="xp" class="pg"></div>
 <div id="xr" class="xr"></div>
 <div class="xt">Transform, first match wins</div>
 <div id="xt"></div>
 <div id="xe" class="er"></div>
</div>
<script>
let W=240,H=160,N=W*H;const E=0,R=1,S=2,WD=3,L=4,WA=5,F=6,SM=7,ICE=8,VAP=9,CAP=400,REACH=18,PICK_BP=3,AMB=70;
let g=new Uint8Array(N),v=new Uint8Array(N),tp=new Int16Array(N).fill(AMB),surf=new Int16Array(W);
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),bf=document.getElementById('bf');
let frame=0,tool=0,bucket=0,lastB=-1,TB=AMB;
const c32=h=>{const n=parseInt(h.slice(1),16);return((255<<24)|((n&255)<<16)|(n&65280)|(n>>16))>>>0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
/* 256-color palette (16 system + 6x6x6 cube + 24 grays) */
const PAL=[];
['000000','800000','008000','808000','000080','800080','008080','c0c0c0','808080','ff0000','00ff00','ffff00','0000ff','ff00ff','00ffff','ffffff'].forEach(h=>PAL.push('#'+h));
{const lv=[0,95,135,175,215,255],x2=n=>n.toString(16).padStart(2,'0');
 for(let r=0;r<6;r++)for(let a=0;a<6;a++)for(let b=0;b<6;b++)PAL.push('#'+x2(lv[r])+x2(lv[a])+x2(lv[b]));
 for(let i=0;i<24;i++)PAL.push('#'+x2(8+i*10).repeat(3))}
const near=h=>{const n=parseInt(h.slice(1),16),r=n>>16,a=(n>>8)&255,b=n&255;let bi=0,bd=1e9;
 PAL.forEach((p,i)=>{const m=parseInt(p.slice(1),16),d=(r-(m>>16))**2+(a-((m>>8)&255))**2+(b-(m&255))**2;if(d<bd){bd=d;bi=i}});return bi};
/* ---------- material registry ---------- */
/* transform rows in priority order (top wins): key, label, ge (true = fires at or above the threshold) */
const TRK=[['fz','Freeze',0],['ml','Melt',1],['pc','Precip',0],['bl','Boil',1]];
const trd=()=>({fz:{on:0,t:32,to:''},ml:{on:0,t:33,to:''},pc:{on:0,t:211,to:''},bl:{on:0,t:212,to:''}});
/* internal data fields without panel rows: ign = ignition chance, span = wood-like span cost, dc = decay, shat/deb = landing debris */
const HID0={ign:.03,span:1,dc:0,shat:.35,deb:''};
const bm=(id,n,cols,st,wt,hard,flam,sup,x,tr)=>({b:1,id,n,c:cols.map(near),st,wt,hard,flam,sup,...HID0,...x,tr:{...trd(),...tr}});
const BUILT=[
 bm('rock','Rock',['#6b6b73','#5e5e66','#77777f','#55555d'],'s',0,3,0,1,{span:0,shat:.5,deb:'sand'}),
 bm('sand','Sand',['#e0c36a','#d6b75d','#e8cd78','#cfb056'],'s',30,1,0,1,{}),
 bm('wood','Wood',['#8b5a2b','#7d4f24','#96622f','#70461f'],'s',0,2,1,1,{}),
 bm('leaves','Leaves',['#3f9a3a','#368a33','#4aa843','#2e7a2c'],'s',0,1,1,1,{ign:.08,span:0,shat:0}),
 bm('water','Water',['#2f6fdb','#3a7be6','#2864c8','#4287f0'],'l',10,99,0,0,{},{fz:{on:1,t:32,to:'ice'},bl:{on:1,t:212,to:'vapor'}}),
 bm('fire','Fire',['#ff7a1a','#ffb020','#ff4a10','#ffd24a'],'g',-8,99,0,0,{}),
 bm('smoke','Smoke',['#8a8a8a','#777777','#999999','#666666'],'g',-10,99,0,0,{dc:.025}),
 bm('ice','Ice',['#bfe6ff','#a8d8f5','#d4f0ff','#9ccbe8'],'s',0,2,0,1,{},{ml:{on:1,t:33,to:'water'}}),
 bm('vapor','Water vapor',['#e8eef5','#dfe8f2','#f2f6fa','#d6e0ec'],'g',-5,99,0,0,{},{pc:{on:1,t:211,to:'water'}})
];
let MATS=[null],MI={};
const ST=new Uint8Array(256),WT=new Int8Array(256),FL=new Uint8Array(256),SP=new Uint8Array(256),HD=new Float32Array(256),IG=new Float32Array(256),SPN=new Uint8Array(256),DC=new Float32Array(256),SH=new Float32Array(256),DB=new Uint8Array(256),RG=new Uint8Array(256),SB=new Uint8Array(256),NV=new Uint8Array(256);
let COL=[],XF=[];
/* one shared rule for every place a tool or weapon breaks a material */
const canBreak=(bp,t)=>t>0&&!!MATS[t]&&bp>=HD[t];
function compile(){
 MI={};MATS.forEach((m,i)=>{if(m)MI[m.id]=i});
 [ST,WT,FL,SP,HD,IG,SPN,DC,SH,DB,RG,SB,NV].forEach(a=>a.fill(0));COL=[];XF=[];
 MATS.forEach((m,i)=>{if(!m)return;
  ST[i]=m.st==='s'?1:m.st==='l'?2:3;WT[i]=m.wt;FL[i]=m.flam?1:0;SP[i]=m.sup?1:0;HD[i]=m.hard;IG[i]=m.ign||0;SPN[i]=m.span;DC[i]=m.dc||0;SH[i]=m.shat||0;DB[i]=MI[m.deb]||0;
  NV[i]=m.c.length;COL[i]=Uint32Array.from(m.c.map(c=>c32(PAL[c])));RG[i]=ST[i]===1&&WT[i]===0&&SP[i]?1:0});
 MATS.forEach((m,i)=>{if(!m)return;SB[i]=ST[i]===1&&SP[i]&&!RG[i]?1:0;
  const r=[];TRK.forEach(([k,,ge])=>{const u=m.tr[k],to=u&&u.on?MI[u.to]:0;if(u&&u.on&&to&&to!==i&&Number.isFinite(+u.t))r.push({ge,th:+u.t,to})});
  XF[i]=r.length?r:null});
}
function fixMat(r){
 const o={...HID0,...r};o.id=o.id||uid();
 o.c=Array.isArray(o.c)&&o.c.length?o.c.slice(0,5).map(c=>Math.max(0,Math.min(255,c|0))):[near('#c0c0c0')];
 o.hard=Math.max(0,+o.hard||0);o.wt=Math.max(-50,Math.min(50,Math.round(+o.wt||0)));
 o.st=o.st&&'slg'.includes(o.st)?o.st:'s';o.flam=o.flam?1:0;o.sup=o.sup?1:0;
 const d=trd();o.tr=o.tr||{};TRK.forEach(([k])=>{o.tr[k]={...d[k],...(o.tr[k]||{})}});
 return o;
}
function loadMats(st){
 MATS=[null];BUILT.forEach(m=>MATS.push(JSON.parse(JSON.stringify(m))));
 st.forEach(r=>{if(!r||typeof r!=='object')return;const k=MATS.findIndex(m=>m&&m.id===r.id);
  if(k>0)MATS[k]={...fixMat({...MATS[k],...r}),b:1};
  else if(MATS.length<256){const o=fixMat(r);if(!String(r.n||'').trim())o.n='Material '+MATS.length;MATS.push({...o,b:0})}});
 compile();
}
loadMats([]);
/* variants are chosen from the pixel position when it is created, then travel with the pixel */

function liq(i,x,y,t){

   const s=Math.random()<.5?-1:1;
   for(let k=0;k<2;k++){const dx=k?-s:s,nx=x+dx;if(nx<0||nx>=W)continue;if(g[j+dx]===0&&g[i+dx]===0){sw(i,j+dx);return}}}}
 const s=Math.random()<.5?-1:1;
 for(let k=0;k<2;k++){const dx=k?-s:s;let j=i;
  for(let c=1;c<=3;c++){const nx=x+dx*c;if(nx<0||nx>=W||g[y*W+nx]!==0)break;j=y*W+nx}

 if(w<0&&y===0){g[i]=0;return}
 if(Math.random()>=.6)return;

 if((!dx&&!dy)||nx<0||nx>=W||ny<0||ny>=H)return;

const DX=[1,-1,0,0],DY=[0,0,1,-1];

  if(ST[t]===2&&!FL[t]){g[i]=SM;v[i]=vf(SM,i);return}
  if(FL[t]){fu++;if(Math.random()<IG[t])ig(j)}}
 if(Math.random()<(fu?.03:.12)){if(Math.random()<.4){g[i]=SM;v[i]=vf(SM,i)}else g[i]=0;return}

function rel(j,c,h,lv){const t=g[j];if(!RG[t])return;const n=c+(h?SPN[t]:0);if(n<=D&&cs[j]>n){cs[j]=n;lv[n].push(j)}}

  for(const j of[i-W,i+W,x>0?i-1:-1,x<W-1?i+1:-1]){if(j<0||j>=N||cs[j]!==255)continue;if(RG[g[j]]){cs[j]=254;cells.push(j);st.push(j)}}}

 for(const i of cells){const j=i+W;if(j>=N)return;if(cs[j]===254)continue;const t=g[j];if(t!==0&&ST[t]<2)return}

  let x0=o.w,y0=o.h,x1=-1,y1=-1;const s0=c.st[0];
  s0.l.forEach(k=>{const a=s0.f[k];for(let i=0;i<a.length;i++)if(a[i]){const x=i%o.w,y=(i/o.w)|0;x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}});
  if(x1<0){x0=0;y0=0;x1=0;y1=0}c.bx=x0;c.by=y0;c.bw=x1-x0+1;c.bh=y1-y0+1;PCH.set(o,c);
 }
 return c;
}
function setPlayer(){
 const o=pcs.find(p=>p.id===(pcOv||defPc))||pcs.find(p=>p.id===defPc)||pcs[0],c=pcr(o);
 P0.ch=o;P0.w=c.bw;P0.h=c.bh;P0.spd=P0.bspd=SPD[(o.spd|0)-1]||.55;P0.jv=JMP[(o.jmp|0)-1]||1.5;P0.fp=!!o.fpf;
 P0.maxhp=Math.max(1,o.hp|0);P0.hp=P0.maxhp;P0.cap=Math.max(1,o.inv|0);P0.cd=0;P0.ih=0;P0.fl=0;P0.sw=0;P0.as=0;lastHp=-1;
}
function startLoadout(){(P0.ch.start||[]).forEach(id=>addInv(id));renderInv()}
function drawPlayer(){
 const o=P0.ch;if(!o){drawEnt(P0);return}
 const c=pcr(o),s=c.st[P0.as]||c.st[0],k=s.l[Math.floor(frame*o.fps/60)%s.l.length],a=s.f[k],ox=Math.floor(P0.x)-c.bx,oy=Math.floor(P0.y)-c.by,flip=P0.face<0,mx=q=>flip?2*c.bx+c.bw-1-q:q;
 ctx.globalAlpha=P0.fl>0&&(frame>>1)&1?.45:1;
 for(let i=0;i<a.length;i++)if(a[i]){ctx.fillStyle=NC[a[i]][1];ctx.fillRect(ox+mx(i%o.w),oy+((i/o.w)|0),1,1)}
 ctx.globalAlpha=1;
 SL.forEach((sn,si)=>{const sl=eq[sn];if(!sl)return;const it=itm(sl.id);if(!it)return;
  const p=s.mp[si]&&s.mp[si][k];let px,py;
  if(p){px=ox+mx(p[0]);py=oy+p[1]}
  else{const X=Math.floor(P0.x),Y=Math.floor(P0.y);px=sn==='Hand'?X+(flip?-1:P0.w):sn==='Off hand'?X+(flip?P0.w:-1):X+(P0.w>>1);py=sn==='Head'?Y-1:Y+(P0.h>>1)}
  drawIt(it,px,py,1,flip)});
}
const defOf=()=>{let n=0;['Off hand','Head','Back'].forEach(sn=>{const sl=eq[sn],o=sl&&items.find(i=>i.id===sl.id);if(o&&(o.type==='Shield'||o.type==='Armor'))n+=Math.max(1,o.dmg|0)});return n};
function hitPlayer(n,fx,dir,src){
 if(P0.ih>0||n<=0)return;
 n=Math.max(1,n-Math.floor(defOf()/2));P0.hp-=n;P0.ih=30;P0.fl=10;
 ['Off hand','Head','Back'].forEach(sn=>{const sl=eq[sn],o=sl&&items.find(i=>i.id===sl.id);if(o&&(o.type==='Shield'||o.type==='Armor'))wear(sl,1)});
 if(P0.hp<=0){die();return}
 if(fx)applyFx(fx,P0,dir||1,src);
}
const dotP=n=>{P0.hp-=n;P0.fl=6;if(P0.hp<=0)die()};
/* respawn rule comes from the character: back to the spawn point, or back to where the room was entered */
function die(){
 const rule=(P0.ch&&P0.ch.rsp)||'Spawn point';
 P0.hp=P0.maxhp;P0.ih=90;P0.vy=0;
 if(rule==='Room entry'&&P0.entry){P0.x=P0.entry.x;P0.y=P0.entry.y;return}
 if(WLD&&WLD.at!==WLD.start){const st=WLD.inst.find(i=>i.id===WLD.start);if(st){switchRoom(st,0,0);spawn(true,st.m.sp);P0.entry={x:P0.x,y:P0.y};return}}
 spawn(RS.mapw,RS.sp);
}
function playerTick(){
 if(P0.cd>0)P0.cd--;if(P0.ih>0)P0.ih--;if(P0.fl>0)P0.fl--;
 const gnd=hit(P0.x,P0.y+1,P0.w,P0.h);
 P0.as=P0.sw>0?4:P0.wet?3:!gnd?2:P0.mv?1:0;
 if(P0.burn>0){P0.burn--;if(!P0.fp&&P0.burn%40===0)dotP(1)}
 if(P0.psn>0){P0.psn--;if(P0.psn%45===0)dotP(1)}
 P0.spd=P0.frz>0?P0.bspd*.4:P0.bspd;if(P0.frz>0)P0.frz--;
 if(P0.kb){const nx=P0.x+P0.kb;if(!hit(nx,P0.y,P0.w,P0.h))P0.x=nx;P0.kb*=.8;if(Math.abs(P0.kb)<.2)P0.kb=0}
 if(!(frame%20)&&!P0.fp){const x0=Math.floor(P0.x),y0=Math.floor(P0.y);let burn=0;
  for(let j=Math.max(0,y0);j<y0+P0.h&&j<H&&!burn;j++)for(let i=Math.max(0,x0);i<x0+P0.w&&i<W;i++)if(g[j*W+i]===F){burn=1;break}
  if(burn)hitPlayer(1)}
}
function breakSlot(sl){
 const k=inv.indexOf(sl);if(k>=0)inv.splice(k,1);
 for(const sn in eq)if(eq[sn]===sl)eq[sn]=null;
 if(!eq.Hand&&tool===3)sel(0);if(isel>=inv.length)isel=-1;renderInv();
}
function wear(sl,n){if(sl.d==null)return;sl.d-=n;if(sl.d<=0)breakSlot(sl)}
function equip(sl,o){
 const sn=o.slot;
 if(eq[sn]===sl){eq[sn]=null;if(sn==='Hand'&&tool===3)sel(0);return}
 const hand=eq.Hand&&items.find(i=>i.id===eq.Hand.id);
 if(sn==='Off hand'&&hand&&hand.two)return;
 if(sn==='Hand'&&o.two)eq['Off hand']=null;
 eq[sn]=sl;if(sn==='Hand'&&(o.type==='Weapon'||o.type==='Tool'))sel(3);
}
function usePotion(sl,o){
 if(o.fx==='Heal')P0.hp=Math.min(P0.maxhp,P0.hp+Math.max(2,(o.dmg|0)*2));
 sl.n--;if(sl.n<=0)breakSlot(sl);else renderInv();
}
function useSlot(sl){
 const o=items.find(i=>i.id===sl.id);if(!o)return;
 if(o.type==='Potion'){usePotion(sl,o);return}
 equip(sl,o);renderInv();
}
function dropSlot(sl){
 const k=inv.indexOf(sl);if(k<0)return;
 inv.splice(k,1);for(const sn in eq)if(eq[sn]===sl)eq[sn]=null;if(!eq.Hand&&tool===3)sel(0);
 drops.push({id:sl.id,x:Math.floor(P0.x+P0.w/2),y:Math.floor(P0.y+P0.h-1),vy:-1,q:sl.n,dur:sl.d,nt:60});isel=-1;renderInv();
}
/* the equipped Hand item: weapons swing, tools break materials with their own Breaking Power */
function useItem(tx,ty){
 const sl=eq.Hand;if(!sl||P0.cd>0)return;const o=items.find(i=>i.id===sl.id);if(!o)return;
 if(o.type==='Weapon'){const a=attackOf(o);P0.cd=a.cd;P0.sw=a.kind==='ranged'?8:12;performAttack(actorP(),a,ptr.x,ptr.y);wear(sl,1)}
 else if(o.type==='Tool'){
  P0.cd=Math.max(6,40-(o.spd|0)*6);P0.sw=8;let n=0;
  disc(tx,ty,2,i=>{const t=g[i];if(ST[t]===1&&canBreak(o.bp|0,t)){g[i]=DB[t]&&Math.random()<.4?DB[t]:E;n++}});
  npcsNear(tx,ty,2).forEach(e=>hurtNpc(e,Math.max(1,o.dmg|0),o.fx));
  if(n)wear(sl,1);
 }
}
/* ================= combat scaffolding =================
   Every attack is data: attackOf(item) -> {kind:'melee'|'ranged', dmg, cd, reach/range, fx, proj}.
   performAttack(actor, attack, aimX, aimY) runs it for the player or an NPC.
   Ranged attacks spawn a projectile built from attack.proj; hits go through strike() and the EFX registry.
   The next pass swaps attackOf()'s inline projectile and EFX entries for data from an effect editor. */
const PVS=[1.6,2.2,3,4,5.2],PGR=[0,.02,.05,.09];
const heal1=(t,dir,src)=>{if(!src||!src.ent||src.ent===t)return;const s=src.ent;if(s===P0)P0.hp=Math.min(P0.maxhp,P0.hp+1);else s.hp=Math.min((s.def.hp|0)*3,s.hp+1)};
const EFX={
 Fire:{c:'#ff7a1a',hit:t=>{if(t===P0&&P0.fp)return;t.burn=120},impact:(x,y)=>disc(x,y,2,i=>{if(FL[g[i]]&&Math.random()<.6)ig(i)})},
 Poison:{c:'#6ee75a',hit:t=>{t.psn=180}},
 Freeze:{c:'#7dd3fc',hit:t=>{t.frz=180}},
 Knockback:{c:'#e5e7eb',hit:(t,dir)=>{t.kb=dir*3}},
 Heal:{c:'#f472b6',hit:heal1}
};
const applyFx=(fx,t,dir,src)=>{const f=EFX[fx];if(f&&f.hit)f.hit(t,dir,src)};
function attackOf(o){
 const kind=o.atk==='Ranged'?'ranged':'melee',dmg=Math.max(1,o.dmg|0),reach=8+(o.rng|0)*5,a={kind,dmg,reach,range:reach,cd:Math.max(6,40-(o.spd|0)*6),fx:o.fx};
 if(kind==='ranged'){const spd=PVS[(o.pv|0)-1]||3,rng=24+(o.rng|0)*24;a.range=rng;a.proj={spd,g:PGR[o.pg|0]||0,life:Math.ceil(rng/spd),pierce:o.pp|0,c:(EFX[o.fx]&&EFX[o.fx].c)||'#f5f5f5',fx:o.fx,dmg}}
 return a;
}
const actorP=()=>({own:'p',cx:P0.x+P0.w/2,cy:P0.y+P0.h/2,w:P0.w,h:P0.h,face:P0.face,ent:P0});
const actorN=e=>({own:'n',cx:e.x+e.w/2,cy:e.y+e.h/2,w:e.w,h:e.h,face:e.face,ent:e});
function strike(t,a,src){if(t===P0)hitPlayer(a.dmg,a.fx,src.face,src);else hurtNpc(t,a.dmg,a.fx,src.face,src)}
function performAttack(src,a,ax,ay){
 if(a.kind==='ranged'){
  const dx=ax-src.cx,dy=ay-src.cy,d=Math.hypot(dx,dy),ux=d>2?dx/d:src.face,uy=d>2?dy/d:0;
  projs.push({x:src.cx+ux*(src.w/2+1),y:src.cy+uy*2-1,vx:ux*a.proj.spd,vy:uy*a.proj.spd,g:a.proj.g,life:a.proj.life,pierce:a.proj.pierce,c:a.proj.c,fx:a.proj.fx,dmg:a.proj.dmg,own:src.own,src,hit:new Set()});
  return 1;
 }
 return meleeHit(src,a);
}
function meleeHit(src,a){
 const targets=src.own==='p'?ents.filter(e=>e.def&&!e.dead):[P0];let any=0;
 [...targets].forEach(t=>{const tx=t.x+t.w/2,ty=t.y+t.h/2;
  if(Math.abs(ty-src.cy)<=Math.max(t.h,src.h)&&(tx-src.cx)*src.face>=-2&&Math.abs(tx-src.cx)<=a.reach+t.w/2){strike(t,a,src);any=1}});
 const f=EFX[a.fx];if(f&&f.impact)f.impact(Math.round(src.cx+src.face*a.reach*.6),Math.round(src.cy));
 slashes.push({x:src.cx+src.face*3,y:src.cy,f:src.face,r:a.reach,t:8});
 return any;
}
function projTick(){
 projs.forEach(p=>{
  const n=Math.max(1,Math.ceil(Math.max(Math.abs(p.vx),Math.abs(p.vy))));
  for(let k=0;k<n&&!p.dead;k++){
   p.x+=p.vx/n;p.y+=p.vy/n;
   if(p.x<0||p.x>=W||p.y>=H||p.y<-60){p.dead=1;break}
   const X=Math.floor(p.x),Y=Math.floor(p.y);
   if(Y>=0&&ST[g[Y*W+X]]===1){projImpact(p);p.dead=1;break}
   const ts=p.own==='p'?ents.filter(e=>e.def&&!e.dead):[P0];
   for(const t of ts){if(p.hit.has(t))continue;
    if(p.x>=t.x&&p.x<t.x+t.w&&p.y>=t.y&&p.y<t.y+t.h){p.hit.add(t);strike(t,{dmg:p.dmg,fx:p.fx},{own:p.own,face:p.vx>=0?1:-1,ent:p.src.ent});if(--p.pierce<0){projImpact(p);p.dead=1;break}}}
  }
  p.vy+=p.g;if(--p.life<=0&&!p.dead){projImpact(p);p.dead=1}
 });
 projs=projs.filter(p=>!p.dead);
}
function projImpact(p){const f=EFX[p.fx];if(f&&f.impact)f.impact(Math.round(p.x),Math.round(p.y))}
function combatTick(){projTick();slashes.forEach(s=>s.t--);slashes=slashes.filter(s=>s.t>0)}
function drawProj(p){
 ctx.fillStyle=p.c;ctx.fillRect(Math.round(p.x)-1,Math.round(p.y)-1,2,2);
 ctx.globalAlpha=.5;ctx.fillRect(Math.round(p.x-p.vx)-1,Math.round(p.y-p.vy)-1,1,1);ctx.globalAlpha=1;
}
function drawSlash(s){
 ctx.globalAlpha=s.t/8;ctx.fillStyle='#ffffff';
 for(let k=1;k<=6;k++)ctx.fillRect(Math.round(s.x+s.f*k*s.r/6),Math.round(s.y-4+k*(8-s.t)/3),1,1);
 ctx.globalAlpha=1;
}
requestAnimationFrame(loop);
